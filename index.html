<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Permintaan Sample R&D</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Formulir Permintaan Sample R&D</h2>
        
        <form id="dataForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nama Sales / Pemohon</label>
                <input type="text" id="nama" required class="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Produk</label>
                <input type="Produk" id="Produk" required class="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Pesan</label>
                <textarea id="pesan" rows="3" required class="mt-1 w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>
            
            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 transition duration-200">
                Kirim Data
            </button>
        </form>
        
        <div id="statusMessage" class="mt-4 text-center text-sm font-semibold hidden"></div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzl4IX2Tr8J1Wtd7WsiOtGNrg_DQA_HBqWMXZZtKrllJjziBQss7TO2QJtpsJRpSE_Gog/exec'; // <-- GANTI DENGAN URL APPS SCRIPT ANDA
        const form = document.getElementById('dataForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', e => {
            e.preventDefault(); // Mencegah reload halaman
            
            // Ubah tombol menjadi loading
            btnSubmit.disabled = true;
            btnSubmit.innerText = 'Mengirim...';
            statusMessage.classList.add('hidden');

            // Ambil data dari inputform
            const formData = {
                nama: document.getElementById('nama').value,
                email: document.getElementById('email').value,
                pesan: document.getElementById('pesan').value
            };

            // Kirim data ke Google Apps Script menggunakan Fetch API
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', // Penting untuk menghindari isu CORS lintas domain
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(() => {
                // Tampilkan pesan sukses
                statusMessage.textContent = 'Data berhasil disimpan';
                statusMessage.className = 'mt-4 text-center text-sm font-semibold text-green-600';
                statusMessage.classList.remove('hidden');
                
                // Reset form
                form.reset();
            })
            .catch(error => {
                // Tampilkan pesan error
                statusMessage.textContent = 'Gagal mengirim data. Coba lagi.';
                statusMessage.className = 'mt-4 text-center text-sm font-semibold text-red-600';
                statusMessage.classList.remove('hidden');
                console.error('Error!', error.message);
            })
            .finally(() => {
                // Kembalikan tombol ke status semula
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Submit';
            });
        });
    </script>
</body>
</html>
